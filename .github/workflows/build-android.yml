name: Build Android APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download OpenCV
        run: |
          wget https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-android-sdk.zip
          unzip opencv-4.12.0-android-sdk.zip

      - name: Setup OpenCV Android SDK
        run: |
          mkdir -p android/opencv
          cp -r OpenCV-android-sdk/sdk/* android/opencv/

      - name: Install JS dependencies
        run: yarn install

      - name: Build Debug APK
        run: |
         cd android
         chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
